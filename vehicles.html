<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Digital Lanka | Vehicle Hub</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700;900&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = { theme: { extend: { "colors": { "primary": "#00113a", "primary-container": "#002366" } } } }
    </script>
    <style>
        body { font-family: 'Public Sans', sans-serif; background: #faf8ff; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .modal { display: none; position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .modal.active { display: flex; }
    </style>
</head>
<body class="bg-background">

    <aside class="hidden md:flex fixed left-0 top-0 h-screen w-64 bg-white border-r border-slate-200 flex-col z-50">
        <div class="p-6">
            <div class="flex items-center gap-3 mb-8 cursor-pointer" onclick="window.location.href='dashboard.html'">
                <img alt="Emblem" class="w-10 h-10 object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB9du4BwTbMu0Y5FuZqQ1wVfZpJSRza9f5ZVhROyUcVOfUtqDXFPqT2muy0Cr1n9Wim3E93diEaxnzcCllUCbTVfhs_6QhKyyafgrL6DbM4JBN0mkivMys3U_anKzsWjZTH5PslOulw9QvKz3o7U8Lo0mRpnpflHYLs_I1NmPE0LJ_jRiJUTA9XBCBePPlh29ysEKRuZotjDquO93ORUhX_xixjiNZ4rqc5C9OrBFVp8-qFa6P7lW2a0XNCsFm9KwFosaII1JME7L0"/>
                <h1 class="text-xl font-black text-[#002366]">Digital Lanka</h1>
            </div>
            <nav class="space-y-1">
                <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-slate-50 transition-all rounded-lg font-medium"><span class="material-symbols-outlined">dashboard</span>Dashboard</a>
                <a href="documents.html" class="flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-slate-50 transition-all rounded-lg font-medium"><span class="material-symbols-outlined">description</span>My Documents</a>
                <a href="vehicles.html" class="flex items-center gap-3 px-4 py-3 bg-slate-50 text-primary border-r-4 border-primary rounded-lg font-medium"><span class="material-symbols-outlined">directions_car</span>Vehicles</a>
                <a id="officer-link" href="officer.html" class="hidden flex items-center gap-3 px-4 py-3 text-slate-600 hover:bg-slate-50 transition-all rounded-lg font-medium"><span class="material-symbols-outlined">security</span>Officer Portal</a>
            </nav>
        </div>
        <div class="mt-auto p-6 border-t border-slate-100">
            <button onclick="logout()" class="w-full flex items-center gap-3 px-4 py-2 text-error font-bold text-red-600"><span class="material-symbols-outlined">logout</span>Logout</button>
        </div>
    </aside>

    <header class="flex justify-between items-center w-full px-4 md:px-8 h-16 sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-slate-200 md:pl-72">
        <div class="text-xl font-black text-[#002366]">My Vehicles</div>
        <button class="bg-primary-container text-white px-4 py-2 rounded-lg font-bold text-sm">Register New</button>
    </header>

    <main class="md:pl-64 min-h-screen p-6 md:p-8">
        <div class="max-w-[1280px] mx-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden group">
                <div class="h-40 bg-slate-200 relative overflow-hidden">
                    <img alt="Vehicle" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCiX0oqNBhitZ2OqzAaJe58RdfltKOYJ42DQRHdtqFyMiMfQLB3QugjXccYab3fW32bJ5bire5ijjucQzDIuACQt9s_hQ6EfM_V40G0bYjlhju7mjK7kDS46mBh0Alj2VfgXNBdYOjvsN4pUfJ7A08gaV8GvKV6gQ7V9zp5H56sPs1095lmU8vLDgkxWzHAFWNDR3w7L0S6-0Ss-tuovUQpQoKYy-kFh1tVy2EgZmbKfKVlJ9drzaL1GXGXVzLoyX77WhYTikK9xD0"/>
                    <div class="absolute top-2 right-2 bg-white/90 px-2 py-1 rounded text-[10px] font-bold text-primary">PRIVATE</div>
                </div>
                <div class="p-6">
                    <p class="text-[10px] text-slate-500 font-bold uppercase mb-1">WP CAS-9082</p>
                    <p class="text-xl font-black text-primary mb-4">Honda Vezel (2018)</p>
                    <button onclick="document.getElementById('modal-grant').classList.add('active')" class="w-full py-3 bg-white border-2 border-primary text-primary font-bold rounded-xl hover:bg-slate-50 transition-colors">Grant Access</button>
                </div>
            </div>
        </div>
    </main>

    <div id="modal-grant" class="modal">
        <div class="bg-white w-full max-w-lg rounded-2xl p-8 relative">
            <button onclick="this.closest('.modal').classList.remove('active')" class="absolute top-4 right-4 text-slate-400"><span class="material-symbols-outlined">close</span></button>
            <h3 class="text-2xl font-bold text-primary mb-6">Grant Access</h3>
            <div class="space-y-4">
                <input class="w-full border border-slate-200 rounded-lg p-4" placeholder="Recipient NIC Number" type="text"/>
                <select class="w-full border border-slate-200 rounded-lg p-4"><option>24 Hours</option><option>48 Hours</option><option>Permanent</option></select>
                <button onclick="alert('Authorization Issued'); this.closest('.modal').classList.remove('active')" class="w-full bg-[#002366] text-white py-4 rounded-xl font-bold">Issue Authorization</button>
            </div>
        </div>
    </div>

    <script>
        let session = JSON.parse(localStorage.getItem('dl_session'));
        if(!session) {
            session = {
                name: "Test User (Dev)",
                nic: "000000000V",
                role: "officer",
                batchNumber: "POL-TEST"
            };
            localStorage.setItem('dl_session', JSON.stringify(session));
        }
        if(session.role === 'officer') document.getElementById('officer-link').classList.remove('hidden');
        function logout() { localStorage.removeItem('dl_session'); window.location.href = 'index.html'; }
    </script>
</body>
</html>
