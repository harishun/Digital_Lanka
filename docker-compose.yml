version: '3.8'

services:
  # ────────────────────────────────────────────────────────────
  # 1. Digital Lanka Application Database Service
  # ────────────────────────────────────────────────────────────
  digital-lanka-db:
    image: mysql:8.0
    container_name: digital_lanka_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: digital_lanka_db
      MYSQL_USER: lanka_user
      MYSQL_PASSWORD: lankapassword
    ports:
      - "3306:3306"
    volumes:
      - ./database/01_digital_lanka_app_db.sql:/docker-entrypoint-initdb.d/01_digital_lanka_app_db.sql
      - app_db_data:/var/lib/mysql

  # ────────────────────────────────────────────────────────────
  # 2. phpMyAdmin for Application Database
  # ────────────────────────────────────────────────────────────
  app_phpmyadmin:
    image: phpmyadmin:latest
    container_name: app_phpmyadmin
    restart: always
    ports:
      - "8083:80"
    environment:
      PMA_HOST: digital-lanka-db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: rootpassword
      UPLOAD_LIMIT: 64M

volumes:
  app_db_data:
