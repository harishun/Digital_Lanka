version: '3.8'

services:
  # ────────────────────────────────────────────────────────────
  # 1. Digital Lanka Application Database Service
  # ────────────────────────────────────────────────────────────
  digital-lanka-db:
    image: mysql:8.0
    container_name: digital_lanka_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: digital_lanka_db
      MYSQL_USER: lanka_user
      MYSQL_PASSWORD: lankapassword
    ports:
      - "3306:3306"
    volumes:
      - ./database/01_digital_lanka_app_db.sql:/docker-entrypoint-initdb.d/01_digital_lanka_app_db.sql
      - app_db_data:/var/lib/mysql

  # ────────────────────────────────────────────────────────────
  # 2. DMT Statutory Mock Registry Database Service
  # ────────────────────────────────────────────────────────────
  dmt-mock-db:
    image: mysql:8.0
    container_name: dmt_mock_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: dmt_mock_db
      MYSQL_USER: dmt_user
      MYSQL_PASSWORD: dmtpassword
    ports:
      - "3307:3306"
    volumes:
      - ./database/02_dmt_registry_db.sql:/docker-entrypoint-initdb.d/02_dmt_registry_db.sql
      - dmt_db_data:/var/lib/mysql

volumes:
  app_db_data:
  dmt_db_data:
