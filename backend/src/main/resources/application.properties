# ==========================================
# Spring Application Config
# ==========================================
spring.application.name=backend
server.port=8085

# ==========================================
# Primary Database (digital_lanka_db - Separate Instance on Port 3306)
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/digital_lanka_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=rootpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# Government Mock REST API Endpoints config
# ==========================================
gov.drp.base-url=http://localhost:8081/api
gov.dmt.base-url=http://localhost:8082/api
gov.api-key=dev_test@123

# ==========================================
# JPA / Hibernate Config
# ==========================================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.main.allow-bean-definition-overriding=true
